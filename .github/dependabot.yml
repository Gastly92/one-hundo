# Dependabot opens a PR when a newer version
# of something we depend on is out: the
# GitHub Actions our workflows use,
# SwiftLint, and the test-only Swift
# packages. Weekly, grouped
# so it stays quiet.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # SwiftLint, pinned in this Dockerfile.
  - package-ecosystem: docker
    directory: /.github/swiftlint
    schedule:
      interval: weekly
    # Old images tagged by Swift version
    # (e.g. 5.5-0.48.0) look newer than
    # 0.65.1 but aren't.
    ignore:
      - dependency-name: realm/swiftlint
        versions: [">= 5"]
  - package-ecosystem: swift
    directory: /Packages/TestSupport
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
