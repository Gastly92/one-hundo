# Dependabot opens a PR when a newer version
# of something we depend on is out: the
# GitHub Actions our workflows use,
# SwiftLint, and the test-only Swift
# packages. Weekly, grouped
# so it stays quiet.
# Each PR is assigned to the owner: GitHub
# emails assignees, but a bot's PR alone
# only notifies those watching the repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [Gastly92]
    groups:
      actions:
        patterns: ["*"]
  # SwiftLint, pinned in this Dockerfile.
  - package-ecosystem: docker
    directory: /.github/swiftlint
    schedule:
      interval: weekly
    assignees: [Gastly92]
    # In 2022 the image was also published
    # with the Swift version in front:
    # 5.5-0.47.0, 5.5-0.47.1, 5.5-0.48.0 and
    # 5.5-latest (SwiftLint 0.47-0.48).
    # Dependabot reads those as version 5.5,
    # newer than 0.65.1, and offers them as
    # an "update". The range covers only
    # those tags, so every real SwiftLint
    # release still comes through (except a
    # 5.5.x, years away if ever).
    ignore:
      - dependency-name: realm/swiftlint
        versions: [">= 5.5, < 5.6"]
  - package-ecosystem: swift
    directory: /Packages/TestSupport
    schedule:
      interval: weekly
    assignees: [Gastly92]
    groups:
      swift:
        patterns: ["*"]
