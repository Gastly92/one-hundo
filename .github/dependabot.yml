# Dependabot opens a PR when a newer version
# of something we depend on is out: the
# GitHub Actions our workflows use, and the
# test-only Swift packages. Weekly, grouped
# so it stays quiet.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /Packages/TestSupport
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
