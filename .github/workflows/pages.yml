name: Pages

# Publishes site/ (the App Store support
# and privacy pages) to GitHub Pages with
# the template's shared workflow. Needs
# Settings → Pages → Source set to "GitHub
# Actions" once (the template's
# docs/NEW-APP.md).
on:
  push:
    branches: [main]
    paths:
      - site/**
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    name: Pages
    uses: gastly92/ios-template/.github/workflows/pages.yml@v1.0.0
