name: Package updates

# Weekly: opens an issue when a Swift package
# pinned in project.yml has a newer release
# (Dependabot covers GitHub Actions only).
on:
  schedule:
  - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check package versions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/check-updates.sh
