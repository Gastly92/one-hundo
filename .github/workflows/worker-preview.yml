name: Worker preview

# The device ID Worker (tools/udid): for a
# pull request that changes it, runs its
# tests and uploads a preview version (the
# live one is untouched), then comments its
# address. Cloudflare's own preview builds
# are off: they ran on every pull request,
# ignoring watch paths. Cloudflare still
# deploys `main` itself.
on:
  pull_request:
    paths:
    - tools/udid/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: worker-preview-${{ github.ref }}
  cancel-in-progress: true

# Steps sit at the same indent as `steps:`
# (valid YAML), so lines fit in 45.
jobs:
  preview:
    name: Test & preview the Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/udid
    env:
      PR: ${{ github.event.number }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Test
      run: node --test test.mjs

    # A version with an alias, e.g.
    # pr-105-onehundo-udid.<name>.workers.dev
    - name: Upload a preview
      env:
        CLOUDFLARE_API_TOKEN: >-
          ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: >-
          ${{
          secrets.CLOUDFLARE_ACCOUNT_ID
          }}
      run: |
        set -o pipefail
        npx --yes wrangler@4.158.0 \
          versions upload \
          --preview-alias "pr-$PR" \
          | tee "$RUNNER_TEMP/upload.log"
        url=$(
          grep -oE "https://pr-$PR-[^ ]+" \
            "$RUNNER_TEMP/upload.log" \
            | head -n 1
        )
        echo "URL=$url" >> "$GITHUB_ENV"

    - name: Comment the address
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        body="Worker preview: $URL"
        body+=" (/install, /profile…)"
        gh pr comment "$PR" --edit-last \
          --body "$body" \
          || gh pr comment "$PR" \
            --body "$body"
