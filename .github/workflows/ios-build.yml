name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the PR touches anything that affects the app.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'OneHundo/**'
              - 'OneHundoTests/**'
              - 'OneHundoUITests/**'
              - 'project.yml'
              - '.swiftlint.yml'
              - '.github/scripts/**'
              - '.github/workflows/**'

  lint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Build for testing, then run the tests, timing each. One simulator: the 3-core
      # runner can't run two (tried in #21: the second timed out, the first slowed 4x).
      - name: Run tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available"; exit 1
          fi
          echo "Testing on simulator $DEVICE_ID"
          mkdir -p build
          common=(-project OneHundo.xcodeproj -scheme OneHundo -destination "id=$DEVICE_ID"
            -derivedDataPath build/test -enableCodeCoverage YES -enableThreadSanitizer YES
            CODE_SIGNING_ALLOWED=NO)
          status=0
          start=$SECONDS
          xcodebuild build-for-testing "${common[@]}" > build/build.log 2>&1 || status=$?
          built=$SECONDS
          if [ "$status" -ne 0 ]; then
            grep -E 'error:' build/build.log || tail -n 60 build/build.log
            exit "$status"
          fi
          xcodebuild test-without-building "${common[@]}" \
            -resultBundlePath build/test.xcresult \
            > build/test.log 2>&1 || status=$?
          tested=$SECONDS
          grep -E '(Test Case .*(passed|failed)|error:|ThreadSanitizer|\*\* TEST)' build/test.log \
            || true
          {
            echo "### Test timings"
            echo "| Phase | Seconds |"
            echo "|---|---|"
            echo "| Build for testing | $((built - start)) |"
            echo "| Run tests | $((tested - built)) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # Each failed test's step-by-step record (taps, waits, what it found).
            awk '/Test Case .* started/ { buf = "" } { buf = buf "\n" $0 }
              /Test Case .* failed/ { print "::group::" $0; print buf; print "::endgroup::" }' \
              build/test.log
            tail -n 60 build/test.log
          fi
          exit "$status"

      - name: Coverage gate
        run: .github/scripts/coverage.sh build/test.xcresult

      # Unused code (functions, properties, types). Reuses the test build's index.
      - name: Periphery
        run: |
          brew install periphery
          periphery version
          periphery scan \
            --project OneHundo.xcodeproj \
            --schemes OneHundo \
            --skip-build \
            --index-store-path build/test/Index.noindex/DataStore \
            --retain-swift-ui-previews \
            --relative-results \
            --format github-actions \
            --strict

  # The Release build for a real iPhone, in parallel with the tests so it doesn't add
  # to the wait. Catches anything that only breaks with optimizations on.
  release:
    name: Release build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20

  # Single pass/fail check for a PR. It always reports, passing when the build
  # was skipped (docs-only PR) or succeeded.
  gate:
    name: CI Gate
    needs: [changes, lint, build, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "changes: ${{ needs.changes.result }}, lint: ${{ needs.lint.result }}," \
            "build: ${{ needs.build.result }}, release: ${{ needs.release.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          for result in "${{ needs.lint.result }}" "${{ needs.build.result }}" \
            "${{ needs.release.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
