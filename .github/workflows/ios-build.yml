name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# Steps sit at the same indent as `steps:`
# (valid YAML), so lines fit in 46.
jobs:
  # Decides whether the PR touches anything
  # that affects the app.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: >-
        ${{ github.event_name !=
        'pull_request' ||
        steps.filter.outputs.code == 'true' }}
    steps:
    - uses: dorny/paths-filter@v4
      id: filter
      if: github.event_name == 'pull_request'
      with:
        filters: |
          code:
            - 'OneHundo/**'
            - 'OneHundoTests/**'
            - 'OneHundoUITests/**'
            - 'project.yml'
            - '.swiftlint.yml'
            - '.github/scripts/**'
            - '.github/workflows/**'

  # Docs, YAML and scripts fit in 46
  # characters too (Swift is SwiftLint's).
  # Runs on every PR, docs-only ones too.
  lines:
    name: Line length
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check line length
      run: .github/scripts/check-lines.py

  # Static checks for the CI workflows
  # (actionlint) and shell scripts
  # (ShellCheck), so a broken TestFlight
  # workflow shows up before it's run.
  # Pinned; same versions run locally.
  scripts:
    name: Workflows & scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install checkers
      run: |
        venv="$RUNNER_TEMP/venv"
        python3 -m venv "$venv"
        "$venv/bin/pip" install -q \
          shellcheck-py==0.11.0.1 \
          actionlint-py==1.7.12.25
        echo "$venv/bin" >> "$GITHUB_PATH"

    - name: ShellCheck
      run: shellcheck .github/scripts/*.sh

    # Also runs ShellCheck on each `run:`
    # block.
    - name: actionlint
      run: actionlint

  lint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
    - uses: actions/checkout@v7

    - name: Lint
      run: |
        swiftlint version
        swiftlint lint --strict \
          --reporter github-actions-logging

  # Every screen must be in the screen list
  # (ScreenID / ScreenHost), so the
  # accessibility audit and localization
  # check cover it.
  screens:
    name: Screen list
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check every screen is listed
      run: .github/scripts/check-screens.sh

  build:
    name: Build & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Show toolchain
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Run tests
      run: .github/scripts/run-tests.sh

    - name: Coverage gate
      run: >-
        .github/scripts/coverage.sh
        build/test.xcresult

    # Unused code (functions, properties,
    # types). Reuses the test build's index.
    - name: Periphery
      run: |
        brew install periphery
        periphery version
        periphery scan \
          --project OneHundo.xcodeproj \
          --schemes OneHundo \
          --skip-build \
          --index-store-path \
          build/test/Index.noindex/DataStore \
          --retain-swift-ui-previews \
          --relative-results \
          --format github-actions \
          --strict

  # The Release build for a real iPhone, in
  # parallel with the tests so it doesn't add
  # to the wait. Catches anything that only
  # breaks with optimizations on.
  release:
    name: Release build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build for device (Release)
      run: |
        set -o pipefail
        xcodebuild build \
          -project OneHundo.xcodeproj \
          -scheme OneHundo \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/device \
          CODE_SIGNING_ALLOWED=NO \
          | tail -n 20

  # Single pass/fail check for a PR. It always
  # reports, passing when the build was
  # skipped (docs-only PR) or succeeded.
  gate:
    name: CI Gate
    needs:
    - changes
    - lines
    - scripts
    - lint
    - screens
    - build
    - release
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      env:
        CHANGES: ${{ needs.changes.result }}
        LINES: ${{ needs.lines.result }}
        SCRIPTS: ${{ needs.scripts.result }}
        LINT: ${{ needs.lint.result }}
        SCREENS: ${{ needs.screens.result }}
        BUILD: ${{ needs.build.result }}
        RELEASE: ${{ needs.release.result }}
      run: |
        for job in CHANGES LINES SCRIPTS \
          LINT SCREENS BUILD RELEASE; do
          echo "$job: ${!job}"
        done
        [ "$CHANGES" = success ] || exit 1
        [ "$LINES" = success ] || exit 1
        [ "$SCRIPTS" = success ] || exit 1
        for result in "$LINT" "$SCREENS" \
          "$BUILD" "$RELEASE"; do
          case "$result" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
        done
