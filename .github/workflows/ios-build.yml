name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the PR touches anything that affects the app.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'OneHundo/**'
              - 'OneHundoTests/**'
              - 'OneHundoUITests/**'
              - 'project.yml'
              - '.swiftlint.yml'
              - '.github/scripts/**'
              - '.github/workflows/**'

  lint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available"; exit 1
          fi
          echo "Testing on simulator $DEVICE_ID"
          mkdir -p build
          status=0
          xcodebuild test \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build/test \
            -resultBundlePath build/test.xcresult \
            -enableCodeCoverage YES \
            -enableThreadSanitizer YES \
            CODE_SIGNING_ALLOWED=NO \
            > build/test.log 2>&1 || status=$?
          grep -E '(Test Case .*(passed|failed)|error:|ThreadSanitizer|\*\* TEST)' build/test.log \
            || true
          if [ "$status" -ne 0 ]; then
            tail -n 60 build/test.log
          fi
          exit "$status"

      - name: Coverage gate
        run: .github/scripts/coverage.sh build/test.xcresult

      # Unused code (functions, properties, types). Reuses the test build's index.
      - name: Periphery
        run: |
          brew install periphery
          periphery version
          periphery scan \
            --project OneHundo.xcodeproj \
            --schemes OneHundo \
            --skip-build \
            --index-store-path build/test/Index.noindex/DataStore \
            --retain-swift-ui-previews \
            --relative-results \
            --format github-actions \
            --strict

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20
          cd build/sim/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/build/OneHundo-simulator.zip" OneHundo.app

      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/OneHundo.app build/ipa/Payload/
          cd build/ipa && zip -qry "$GITHUB_WORKSPACE/build/OneHundo-unsigned.ipa" Payload

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: OneHundo-simulator
          path: build/OneHundo-simulator.zip

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OneHundo-unsigned-ipa
          path: build/OneHundo-unsigned.ipa

  # Single pass/fail check for a PR. It always reports, passing when the build
  # was skipped (docs-only PR) or succeeded.
  gate:
    name: CI Gate
    needs: [changes, lint, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "changes: ${{ needs.changes.result }}, lint: ${{ needs.lint.result }}, build: ${{ needs.build.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          for result in "${{ needs.lint.result }}" "${{ needs.build.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
