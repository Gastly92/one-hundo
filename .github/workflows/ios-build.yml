name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available"; exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          mkdir -p build
          xcodebuild test \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log | grep -E '(error|warning:|Test Case|\*\* TEST)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' build/test.log

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20
          cd build/sim/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/build/OneHundo-simulator.zip" OneHundo.app

      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/OneHundo.app build/ipa/Payload/
          cd build/ipa && zip -qry "$GITHUB_WORKSPACE/build/OneHundo-unsigned.ipa" Payload

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: OneHundo-simulator
          path: build/OneHundo-simulator.zip

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OneHundo-unsigned-ipa
          path: build/OneHundo-unsigned.ipa

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/test.log
