name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding the record-snapshots
    # label records every snapshot again.
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# Steps sit at the same indent as `steps:`
# (valid YAML), so lines fit in 45.
jobs:
  # Decides whether the PR touches anything
  # that affects the app.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: >-
        ${{ github.event_name !=
        'pull_request' ||
        steps.filter.outputs.code ==
        'true' }}
    steps:
    - uses: dorny/paths-filter@v4
      id: filter
      if: github.event_name == 'pull_request'
      with:
        filters: |
          code:
            - 'OneHundo/**'
            - 'OneHundoTests/**'
            - 'OneHundoUITests/**'
            - 'project.yml'
            - 'Packages/**'
            - '.swiftlint.yml'
            - '.github/swiftlint/**'
            - '.github/scripts/**'
            - '.github/workflows/**'

  # Docs, YAML and scripts fit in 45
  # characters too (Swift is SwiftLint's).
  # Runs on every PR, docs-only ones too.
  lines:
    name: Line length
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check line length
      run: .github/scripts/check-lines.py

  # Every String Catalog key is still used
  # by some Swift string.
  strings:
    name: String catalog
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check for unused keys
      run: .github/scripts/check-strings.py

  # Static checks for the CI workflows
  # (actionlint) and shell scripts
  # (ShellCheck), so a broken TestFlight
  # workflow shows up before it's run.
  # Pinned; same versions run locally.
  scripts:
    name: Workflows & scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install checkers
      run: |
        venv="$RUNNER_TEMP/venv"
        python3 -m venv "$venv"
        "$venv/bin/pip" install -q \
          -r .github/scripts/checkers.txt
        echo "$venv/bin" >> "$GITHUB_PATH"

    - name: ShellCheck
      run: |
        shellcheck .github/scripts/*.sh \
          .claude/hooks/*.sh

    # Also runs ShellCheck on each `run:`
    # block.
    - name: actionlint
      run: actionlint

  lint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # The same script Claude runs before
    # pushing; the version is pinned in
    # .github/swiftlint/Dockerfile.
    - name: Lint
      run: .github/scripts/swiftlint.sh

  # Every screen must be in the screen list
  # (ScreenID / ScreenHost), so the
  # accessibility audit and localization
  # check cover it.
  screens:
    name: Screen list
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check every screen is listed
      run: .github/scripts/check-screens.sh

  # Builds the app and tests once, for the
  # test shards below.
  build:
    name: Build for testing
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Show toolchain
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    # The last build from main (packages
    # like swift-syntax compile once, not on
    # every run). Changed files rebuild as
    # usual. Saved only from main, so a PR
    # never feeds another.
    - name: Cache key
      id: key
      run: |
        xcode=$(
          xcodebuild -version | head -1
        )
        deps=$(find project.yml Packages \
          -type f | sort | xargs cat \
          | shasum | cut -c1-12)
        prefix="build-${xcode// /-}-$deps"
        echo "prefix=$prefix" \
          >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      with:
        path: build/test
        key: >-
          ${{ steps.key.outputs.prefix }}-${{
          github.sha }}
        restore-keys: >-
          ${{ steps.key.outputs.prefix }}-

    - name: Build
      run: .github/scripts/run-tests.sh build

    - uses: actions/cache/save@v6
      if: github.ref == 'refs/heads/main'
      with:
        path: build/test
        key: >-
          ${{ steps.key.outputs.prefix }}-${{
          github.sha }}

    # A tar keeps the apps' permissions and
    # links, which artifacts drop.
    - name: Pack the build
      run: >-
        tar -cf build/products.tar
        build/test/Build/Products

    - uses: actions/upload-artifact@v7
      with:
        name: test-build
        path: build/products.tar
        retention-days: 1

    # Unused code (functions, properties,
    # types). Reuses the build's index, while
    # the tests run.
    - name: Periphery
      run: |
        brew install periphery
        periphery version
        index=build/test/Index.noindex
        periphery scan \
          --project OneHundo.xcodeproj \
          --schemes OneHundo \
          --skip-build \
          --index-store-path \
          "$index/DataStore" \
          --retain-swift-ui-previews \
          --relative-results \
          --format github-actions \
          --strict

  # The tests, split into shards that run in
  # parallel on separate runners (one
  # simulator each). See run-tests.sh.
  test:
    name: Test (${{ matrix.shard }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [light, dark, largest, main]
    # Write access only to commit recorded
    # snapshot images to the PR branch.
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7

    - name: Boot the simulator
      run: .github/scripts/run-tests.sh boot

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - uses: actions/download-artifact@v8
      with:
        name: test-build
        path: build

    - name: Unpack the build
      run: tar -xf build/products.tar

    - name: Run tests
      env:
        LABELS: >-
          ${{ toJSON(
          github.event.pull_request.labels.*.name
          ) }}
      run: >-
        .github/scripts/run-tests.sh test
        ${{ matrix.shard }}

    # New screens' images (or all, with the
    # label) go to the PR branch, and CI runs
    # again on that commit. Snapshot tests
    # are in the main shard.
    - name: Save snapshot images
      if: >-
        always() && matrix.shard == 'main'
        && github.event_name
        == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref }}
        PR: ${{ github.event.number }}
      run: .github/scripts/save-snapshots.sh

    # On a mismatch: the reference, the new
    # image and their difference.
    - name: Upload snapshot diffs
      if: failure() && matrix.shard == 'main'
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-diffs
        path: build/snapshot-diffs
        if-no-files-found: ignore

    # For the coverage gate, which merges
    # all shards.
    - name: Pack the results
      if: always()
      run: >-
        tar -cf build/result.tar
        build/test.xcresult

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: result-${{ matrix.shard }}
        path: build/result.tar
        retention-days: 1

  # Every line of the app runs in some
  # shard's tests.
  coverage:
    name: Coverage
    needs: test
    runs-on: macos-26
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        pattern: result-*

    - name: Merge the shards' results
      run: |
        results=()
        for tar in result-*/result.tar; do
          dir="${tar%/result.tar}"
          tar -xf "$tar" -C "$dir"
          results+=(
            "$dir/build/test.xcresult"
          )
        done
        xcrun xcresulttool merge \
          "${results[@]}" \
          --output-path merged.xcresult

    - name: Coverage gate
      run: >-
        .github/scripts/coverage.sh
        merged.xcresult

  # The Release build for a real iPhone, in
  # parallel with the tests so it doesn't add
  # to the wait. Catches anything that only
  # breaks with optimizations on.
  release:
    name: Release build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build for device (Release)
      run: |
        set -o pipefail
        xcodebuild build \
          -project OneHundo.xcodeproj \
          -scheme OneHundo \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/device \
          CODE_SIGNING_ALLOWED=NO \
          | tail -n 20

  # Single pass/fail check for a PR. It
  # always reports, passing when the build
  # was skipped (docs-only PR) or succeeded.
  gate:
    name: CI Gate
    needs:
    - changes
    - lines
    - strings
    - scripts
    - lint
    - screens
    - build
    - test
    - coverage
    - release
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      env:
        CHANGES: ${{ needs.changes.result }}
        LINES: ${{ needs.lines.result }}
        STRINGS: ${{ needs.strings.result }}
        SCRIPTS: ${{ needs.scripts.result }}
        LINT: ${{ needs.lint.result }}
        SCREENS: ${{ needs.screens.result }}
        BUILD: ${{ needs.build.result }}
        TEST: ${{ needs.test.result }}
        COVER: ${{ needs.coverage.result }}
        RELEASE: ${{ needs.release.result }}
      run: |
        for job in CHANGES LINES STRINGS \
          SCRIPTS LINT SCREENS BUILD TEST \
          COVER RELEASE; do
          echo "$job: ${!job}"
        done
        [ "$CHANGES" = success ] || exit 1
        [ "$LINES" = success ] || exit 1
        [ "$STRINGS" = success ] || exit 1
        [ "$SCRIPTS" = success ] || exit 1
        for result in "$LINT" "$SCREENS" \
          "$BUILD" "$TEST" "$COVER" \
          "$RELEASE"; do
          case "$result" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
        done
