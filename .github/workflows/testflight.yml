name: TestFlight

# Run from the GitHub app: Actions →
# TestFlight → Run workflow. Uploads the
# app to TestFlight with the template's
# shared workflow (see RULES.md).
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    name: TestFlight
    uses: gastly92/ios-template/.github/workflows/testflight.yml@v1.0.0
    secrets: inherit
