name: TestFlight

# Run from the GitHub app: Actions →
# TestFlight → Run workflow. Signing is done
# by Apple ("cloud signing") using the App
# Store Connect API key, so no certificates or
# provisioning profiles are stored in the
# repo.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

# Steps sit at the same indent as `steps:`
# (valid YAML), so lines fit in 46.
jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID:
        ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:
        ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ARCHIVE: build/OneHundo.xcarchive
    steps:
    - name: Check secrets
      run: |
        missing=""
        for name in APPLE_TEAM_ID ASC_KEY_ID \
          ASC_ISSUER_ID ASC_KEY_P8; do
          [ -n "${!name}" ] \
            || missing+=" $name"
        done
        if [ -n "$missing" ]; then
          echo "::error::Missing repository" \
            "secrets:$missing (see" \
            "docs/TESTFLIGHT.md)"
          exit 1
        fi

    - uses: actions/checkout@v7

    - name: Show toolchain
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Write API key
      run: |
        dir="$RUNNER_TEMP/keys"
        mkdir -p "$dir"
        KEY_PATH="$dir/AuthKey_$ASC_KEY_ID.p8"
        printf '%s\n' "$ASC_KEY_P8" \
          > "$KEY_PATH"
        echo "KEY_PATH=$KEY_PATH" \
          >> "$GITHUB_ENV"

    # Archive unsigned; the export step below
    # signs with Apple's cloud-managed
    # distribution certificate and uploads to
    # App Store Connect.
    - name: Archive
      run: |
        set -o pipefail
        num="$GITHUB_RUN_NUMBER"
        xcodebuild archive \
          -project OneHundo.xcodeproj \
          -scheme OneHundo \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath "$ARCHIVE" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CURRENT_PROJECT_VERSION="$num" \
          CODE_SIGNING_ALLOWED=NO \
          | tail -n 30

    - name: Sign & upload
      run: |
        options=build/ExportOptions.plist
        cat > "$options" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>destination</key>
          <string>upload</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>teamID</key>
          <string>$APPLE_TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
        </dict>
        </plist>
        PLIST
        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE" \
          -exportOptionsPlist "$options" \
          -exportPath build/export \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$KEY_PATH" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID \
          "$ASC_ISSUER_ID"

    - name: Summary
      run: |
        num="$GITHUB_RUN_NUMBER"
        {
          echo "Uploaded build $num to App" \
            "Store Connect."
          echo "It appears in TestFlight" \
            "after Apple finishes" \
            "processing (usually 5–15 min)."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Remove API key
      if: always()
      run: rm -rf "$RUNNER_TEMP/keys"
