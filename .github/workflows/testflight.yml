name: TestFlight

# Run from the GitHub app: Actions →
# TestFlight → Run workflow. Signing is done
# by Apple ("cloud signing") using the App
# Store Connect API key, so no certificates
# or provisioning profiles are stored in the
# repo.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: >-
          Upload to TestFlight (off: only
          build, sign and check the
          entitlements)
        type: boolean
        default: true

# Write access to push the build's tag.
permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: false

# Steps sit at the same indent as `steps:`
# (valid YAML), so lines fit in 45.
jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID:
        ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:
        ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ARCHIVE: build/OneHundo.xcarchive
      APP: Products/Applications/OneHundo.app
      ENTITLEMENTS:
        OneHundo/OneHundo.entitlements
      DESTINATION: >-
        ${{ inputs.upload
        && 'upload' || 'export' }}
    steps:
    - name: Check secrets
      run: |
        missing=""
        for name in APPLE_TEAM_ID \
          ASC_KEY_ID ASC_KEY_P8 \
          ASC_ISSUER_ID; do
          [ -n "${!name}" ] \
            || missing+=" $name"
        done
        if [ -n "$missing" ]; then
          echo "::error::Missing" \
            "repository secrets:$missing" \
            "(see docs/TESTFLIGHT.md)"
          exit 1
        fi

    - uses: actions/checkout@v7

    - name: Show toolchain
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Write API key
      run: |
        dir="$RUNNER_TEMP/keys"
        mkdir -p "$dir"
        KEY_PATH="$dir/AuthKey_$ASC_KEY_ID.p8"
        printf '%s\n' "$ASC_KEY_P8" \
          > "$KEY_PATH"
        echo "KEY_PATH=$KEY_PATH" \
          >> "$GITHUB_ENV"

    # Archive unsigned (no certificate on the
    # runner); the export step below signs
    # with Apple's cloud-managed distribution
    # certificate and uploads to App Store
    # Connect.
    - name: Archive
      run: |
        set -o pipefail
        num="$GITHUB_RUN_NUMBER"
        xcodebuild archive \
          -project OneHundo.xcodeproj \
          -scheme OneHundo \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath "$ARCHIVE" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CURRENT_PROJECT_VERSION="$num" \
          CODE_SIGNING_ALLOWED=NO \
          | tail -n 30

    # An unsigned archive carries no
    # entitlements, and export signs with the
    # ones it finds in the app. Sign it
    # ad hoc with them first.
    - name: Add entitlements
      run: |
        app="$ARCHIVE/$APP"
        codesign --force --sign - \
          --entitlements "$ENTITLEMENTS" \
          --generate-entitlement-der \
          "$app"
        codesign -d --entitlements - \
          --xml "$app" \
          | plutil -p -

    - name: Sign & upload
      run: |
        options=build/ExportOptions.plist
        cat > "$options" <<PLIST
        <?xml version="1.0"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>destination</key>
          <string>$DESTINATION</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>teamID</key>
          <string>$APPLE_TEAM_ID</string>
          <key>manageAppVersionAndBuildNumber</key>
          <false/>
          <key>uploadSymbols</key>
          <true/>
        </dict>
        </plist>
        PLIST
        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE" \
          -exportOptionsPlist "$options" \
          -exportPath build/export \
          -allowProvisioningUpdates \
          -authenticationKeyPath \
          "$KEY_PATH" \
          -authenticationKeyID \
          "$ASC_KEY_ID" \
          -authenticationKeyIssuerID \
          "$ASC_ISSUER_ID"

    # Without upload, the signed app is kept
    # here: check it got every entitlement.
    - name: Check entitlements
      if: ${{ !inputs.upload }}
      run: |
        unzip -q build/export/*.ipa \
          -d build/ipa
        app=build/ipa/Payload/OneHundo.app
        codesign -d --entitlements - \
          --xml "$app" > build/signed.plist
        plutil -p build/signed.plist
        container=iCloud.com.gastly92.onehundo
        for key in aps-environment \
          "$container" CloudKit; do
          grep -q "$key" build/signed.plist \
            || { echo "::error::Signed" \
              "app lacks $key"; exit 1; }
        done
        echo "Signed app has iCloud and" \
          "push entitlements." \
          >> "$GITHUB_STEP_SUMMARY"

    # Marks the uploaded commit, e.g.
    # v0.4.6-build12, so it's clear what each
    # TestFlight build contains.
    - name: Tag the build
      if: ${{ inputs.upload }}
      run: |
        pattern='s/.*"([^"]+)".*/\1/'
        key=MARKETING_VERSION
        version=$(
          grep -m1 "$key" project.yml \
            | sed -E "$pattern"
        )
        num="$GITHUB_RUN_NUMBER"
        tag="v$version-build$num"
        git tag "$tag"
        git push origin "$tag"
        echo "TAG=$tag" >> "$GITHUB_ENV"

    - name: Summary
      if: ${{ inputs.upload }}
      run: |
        num="$GITHUB_RUN_NUMBER"
        {
          echo "Uploaded build $num to App" \
            "Store Connect."
          echo "Tagged $TAG."
          echo "It appears in TestFlight" \
            "after Apple finishes" \
            "processing (usually 5–15 min)."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Remove API key
      if: always()
      run: rm -rf "$RUNNER_TEMP/keys"
