name: TestFlight

# Run from the GitHub app: Actions → TestFlight → Run workflow.
# Signing is done by Apple ("cloud signing") using the App Store Connect API key,
# so no certificates or provisioning profiles are stored in the repo.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see docs/TESTFLIGHT.md)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Archive unsigned; the export step below signs with Apple's cloud-managed
      # distribution certificate and uploads to App Store Connect.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OneHundo.xcodeproj \
            -scheme OneHundo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OneHundo.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 30

      - name: Sign & upload
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/OneHundo.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        run: |
          echo "Uploaded build ${{ github.run_number }} to App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight after Apple finishes processing (usually 5–15 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
