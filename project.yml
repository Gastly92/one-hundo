name: OneHundo
options:
  bundleIdPrefix: com.gastly92
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Code is indented with 2 spaces (lines max 46).
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
settings:
  base:
    MARKETING_VERSION: "0.4.5"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # Every compiler warning fails the build, so none pile up unread.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # Translations live in OneHundo/Localizable.xcstrings (a String Catalog).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  OneHundo:
    type: application
    platform: iOS
    sources:
      - OneHundo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gastly92.onehundo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: One Hundo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Swift 6's data-race checks, in Swift 5 mode (warnings, so errors above).
        SWIFT_STRICT_CONCURRENCY: complete
  OneHundoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OneHundoTests
    dependencies:
      - target: OneHundo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gastly92.onehundo.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  OneHundoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OneHundoUITests
      # The app's list of screens, so UI tests loop over every one.
      - path: OneHundo/Support/ScreenID.swift
    dependencies:
      - target: OneHundo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gastly92.onehundo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OneHundo:
    build:
      targets:
        OneHundo: all
    test:
      gatherCoverageData: true
      # CI runs tests with Thread Sanitizer; a data race stops the app, failing the test.
      environmentVariables:
        TSAN_OPTIONS: halt_on_error=1
      coverageTargets:
        - OneHundo
      targets:
        - OneHundoTests
        - OneHundoUITests
