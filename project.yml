name: OneHundo
options:
  bundleIdPrefix: com.gastly92
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # Every compiler warning fails the build, so none pile up unread.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  OneHundo:
    type: application
    platform: iOS
    sources:
      - OneHundo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gastly92.onehundo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: One Hundo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Swift 6's data-race checks, in Swift 5 mode (warnings, so errors above).
        SWIFT_STRICT_CONCURRENCY: complete
  OneHundoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OneHundoTests
    dependencies:
      - target: OneHundo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gastly92.onehundo.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  OneHundoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OneHundoUITests
    dependencies:
      - target: OneHundo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gastly92.onehundo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OneHundo:
    build:
      targets:
        OneHundo: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - OneHundo
      targets:
        - OneHundoTests
        - OneHundoUITests
