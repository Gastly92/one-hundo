# SwiftLint config. CI runs `swiftlint lint --strict`, so warnings fail the build.
included:
  - OneHundo
  - OneHundoTests
  - OneHundoUITests

disabled_rules:
  # Multi-line lists end with a trailing comma here, so diffs stay one line.
  - trailing_comma

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - first_where
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

identifier_name:
  excluded:
    - id

# Diffs get read in the GitHub iPhone app; 100 fits in landscape.
line_length:
  warning: 100
  ignores_urls: true

# A switch over an enum (e.g. ScreenHost) isn't complex, however many cases it has.
cyclomatic_complexity:
  ignores_case_statements: true

custom_rules:
  # Sentences shown to users must be translatable. In views, literals passed to Text
  # are; in logic they need String(localized:). Catches e.g. `return "Nice work!"`.
  untranslated_logic_text:
    name: "Untranslated text"
    message: "Wrap user-facing text in String(localized:) so it can be translated."
    included: "OneHundo/(Models|Support)/.*\\.swift"
    regex: '(?<!localized)(\breturn|\?|:)\s+"[A-Z][^"\n]* [^"\n]*"'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
